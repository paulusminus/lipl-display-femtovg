[package]
authors = ["Paul Min"]
name = "lipl-display-femtovg"
description = "Showing parts of lyrics received from Gatt Peripheral"
license = "MIT"
version = "0.1.4"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
debug = false
opt-level = "s"

[features]
default = []
gatt = ["dep:lipl-gatt-zbus"]

[dependencies]
env_logger = "0.11.11"
femtovg = "0.28.0"
futures-util = "0.3.34"
glutin = { version = "0.32.3", default-features = false, features = ["egl", "wayland"] }
glutin-winit = "0.5.0"
lipl-display-common = "0.4.8"
lipl-gatt-zbus = { version = "0.5.0", optional = true }
log = "0.4.34"
parse-lines = "0.2.0"
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["rt"] }
tokio-stream = "0.1.19"
winit = { version = "0.30.13", default-features = false }
